plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alexliu07.nopausead'
    compileSdk 35

    defaultConfig {
        applicationId "com.alexliu07.nopausead"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，方便直接装；要上架/长期使用请换成自己的 keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 仅编译期需要，运行时由 LSPosed 提供
    compileOnly 'de.robv.android.xposed:api:82'
}